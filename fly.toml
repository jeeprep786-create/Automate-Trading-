# fly.toml app configuration file generated for saurabh11 on 2026-11-01T22:53:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'saurabh11'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
